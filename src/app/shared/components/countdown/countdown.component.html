    <span class="px-2">{{ days() | pad }}j</span>
    <span>:</span>
    <span class="px-2">{{ hours() | pad }}h</span>

    <span class="px-2">{{ minutes() | pad }}m</span>

    <span class="px-2">{{ seconds() | pad }}s</span>
  </div>
</div>
