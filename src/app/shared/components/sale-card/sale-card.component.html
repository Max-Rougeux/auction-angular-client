<article
  class="bg-neutral-950 hover:bg-neutral-900/50 group relative overflow-hidden outline-1 outline-neutral-800 flex flex-col h-full">
   <div class="overflow-hidden transition-all duration-400 absolute left-0 bottom-0 bg-neutral-100 w-full h-0 group-hover:h-18">
     <div class="size-full flex items-end justify-between p-3 pb-1 pe-2">
       <span class=" tracking-tighter text-sm font-medium uppercase">
         + Get details
       </span>
       <app-arrow-icon [size]="24"/>
     </div>
   </div>


    <!-- Item thumbnail -->
    <div class="transition-all ease-in-out duration-400 relative min-h-43 flex flex-col justify-end mb-2">
      <app-sale-thumbnail [sale]="data()"/>
    </div>

    <!-- Item info -->
    <div class="h-full text-neutral-100 flex flex-col">
      <div class="p-3 mt-3">
        <div class="border opacity-40 p-1 w-fit mb-2">
          <p class="text-box-trim text-xs uppercase tracking-tighter font-mono">{{ data().item.category.label }}</p>
        </div>
        <!-- Item title -->
        <h2 class="  uppercase text-xl tracking-tighter text-box-trim ">
          {{ data().item.name }}
        </h2>
      </div>

      <!-- Item bid + link -->
      <div class="mt-auto p-3">
        <div class="flex items-end gap-1">
          <span class="text-6xl tracking-tighter font-light text-box-trim">
            {{ data().currentPrice }}
          </span>
          <app-money-icon [size]="18"/>
        </div>


<!--        <app-sale-cta [link]="data().slug"-->
<!--                      [price]="data().currentPrice > 0 ? data().currentPrice : data().startingPrice"/>-->
      </div>
    </div>
</article>
