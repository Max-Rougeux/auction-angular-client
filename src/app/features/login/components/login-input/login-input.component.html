<fieldset class="rounded-full border border-neutral-600 px-4 mb-1" [ngClass]="{'text-red-300/80 border-red-300/80': hasError()}">
  <legend class="text-sm font-medium px-2 text-neutral-300" [ngClass]="{'text-red-300/80': hasError()}">
    {{ label() }}
  </legend>
  <input
    [type]="type()"
    [id]="name()"
    [name]="name()"
    [placeholder]="placeholder()"
    [(ngModel)]="value"
    (ngModelChange)="onChange($event)"
    (blur)="onTouched()"
    class="w-full pb-1.5 bg-transparent outline-none text-neutral-300"
    required
  />
</fieldset>
