<button class="cursor-not-allowed mb-3 text-neutral-100 rounded-full p-3 bg-neutral-900 w-full font-medium relative">
  <span class="absolute inset-0 flex items-center pointer-events-nonce px-3">
      <div class="relative w-6 aspect-square">
          <img [ngSrc]="`icon/${provider()}.png` | imgUrl" [alt]="provider() + 'icon'" fill>
      </div>
  </span>
  <p class="mt-0.5">Continue with {{ label() }}</p>
</button>
