<button class="mb-3 text-neutral-300 rounded-full p-3 bg-neutral-800 w-full font-medium relative">
  <span class="absolute inset-0 flex items-center pointer-events-nonce px-3">
      <div class="relative w-6 aspect-square">
          <img ngSrc="http://localhost:8080/uploads/icon/{{ provider() }}.png" [alt]="provider() + 'icon'" fill>
      </div>
  </span>
  <p class="mt-0.5">Continue with {{ label() }}</p>
</button>
