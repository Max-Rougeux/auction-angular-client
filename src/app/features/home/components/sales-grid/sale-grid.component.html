<div class="relative w-full min-h-100">
<!--  <app-marquee content="+SALE.LIST.END//"/>-->

  @if(showGrid()) {
    <div class="flex min-h-100 flex-nowrap overflow-hidden lg:grid grid-cols-5">
      @for (sale of sales(); track $index) {
        <app-sale-card ngmMotion
                       initial="initial"
                       animate="animate"
                       [variants]="itemVariants"
                       [transition]="{ type: 'spring', stiffness: 300, damping: 25, delay: .15 * $index }"
                       [data]="sale"/>
      }
    </div>
  }
</div>
