<article class=" bg-neutral-800 dark:bg-neutral-600 group">
  <div
    class="grid grid-cols-5 border-b dark:border-neutral-600 border-neutral-800 transition-all ease-in-out overflow-hidden  hover:rounded-2xl">
    <!-- Thumbnail -->
    <div ngmMotion
         initial="initial"
         whileInView="animate"
         class="col-span-3 relative"
         [variants]="itemVariants"
         [transition]="{ type: 'spring', stiffness: 300, damping: 25, delay: .2 }">
      <div class="bg-neutral-200 dark:bg-neutral-800 group-hover:bg-neutral-300 dark:group-hover:bg-neutral-800/90 size-full">
        <app-sale-thumbnail [sale]="sale()" [isFeatured]="true"/>
      </div>
    </div>

    <!-- Sale Content -->
    <div ngmMotion
         initial="initial"
         whileInView="animate"
         class="col-span-2 relative"
         [variants]="itemVariants"
         [transition]="{ type: 'spring', stiffness: 300, damping: 25, delay: .4 }">
      <div class="absolute inset-0 flex justify-end px-2 pt-1 pointer-events-none">
        <app-likes [likes]="421"/>
      </div>
      <div class="transition-all duration-400 bg-neutral-200 dark:bg-neutral-800 group-hover:bg-neutral-300 dark:group-hover:bg-neutral-800/90 p-3 pt-4 flex flex-col border-s border-neutral-800 dark:border-neutral-600">
        <h3 class="text-3xl/5 tracking-tighter font-bold uppercase dark:text-neutral-200 mb-1">
          {{ sale().item.name }}
        </h3>
        <app-paragraph [content]="'#' + sale().item.category.label" class="lowercase"/>
        <div class="flex items-center gap-1 text-end text-sm mt-5 mb-2 opacity-80">
          <h3 class="font-semibold tracking-tighter capitalize me-2 dark:text-neutral-200 text-box-trim">+ Start. price :</h3>
          <app-price-layout [value]="sale().startingPrice"/>
        </div>
        <app-paragraph [content]="sale().item.description"/>
        <!-- Seller -->
        <div class="pt-5">
          <app-user-link [user]="sale().seller" info="member since 3 months" [extended]="true"/>
        </div>

        <!-- Recent Activity -->
        <div class="flex items-end justify-between mt-3">

          <div class="flex flex-col gap-2">
            <app-bloc-title title="Recent Activity"/>
            <app-bids-preview/>
          </div>

          <!-- Cta Sale + link -->
          <app-sale-cta [link]="sale().slug" [price]="sale().currentPrice > 0 ? sale().currentPrice : sale().startingPrice" [isFeatured]="true"/>
        </div>
      </div>
    </div>
  </div>
</article>
