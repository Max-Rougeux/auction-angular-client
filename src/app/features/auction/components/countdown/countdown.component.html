<div
  class=" flex  tabular-nums text-white  px-1 w-57">
  <span class="px-2 text-xl text-box-trim">{{ days() | pad }}j</span>
  <span class="text-box-trim">:</span>
  <span class="px-2 text-xl text-box-trim">{{ hours() | pad }}h</span>
  <span class="text-box-trim">:</span>
  <span class="px-2 text-xl text-box-trim">{{ minutes() | pad }}m</span>
  <span class="text-box-trim">:</span>
  <span class="px-2 text-xl text-box-trim">{{ seconds() | pad }}s</span>
</div>
