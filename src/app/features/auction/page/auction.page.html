@if (sale(); as sale) {
  <app-topbar/>
  <main
    class="w-full flex flex-col border-y border-neutral-800">
    <div class="grid grid-cols-10">
      <section class="lg:col-span-2 relative md:hidden lg:flex flex-col">
        <app-breadcrumb [items]="[{ label: 'infos' }]"/>
        <div class="px-3 pb-3">
          <app-bloc-title title="description" class="text-white"/>
          <div ngmMotion
               [initial]="{ opacity: 0, y: 40 }"
               [animate]="{ opacity: 1, y: 0 }"
               [transition]="{ type: 'spring', stiffness: 300, damping: 25, delay: .3 }"
               class="mt-3 text-neutral-300">
            <app-paragraph [content]="sale.item.description"/>
          </div>
        </div>
        <app-specs-container [sale]="sale"/>
        <app-tags-container [sale]="sale"/>
        <div class="px-3 mt-3">
          <app-bloc-title title="Seller"/>
          <div ngmMotion
               [initial]="{ opacity: 0, y: 40 }"
               [animate]="{ opacity: 1, y: 0 }"
               [transition]="{ type: 'spring', stiffness: 300, damping: 25, delay: .8 }"
               class="mt-2">
            <app-user-link [user]="sale.owner" info="member since 3 months" [extended]="true"/>
          </div>
        </div>
      </section>
      <section class="lg:col-span-6 md:col-span-6 border-x border-neutral-800 relative h-full flex flex-col">
        <app-main-panel [sale]="sale" class="contents"/>
      </section>
      <section class="lg:col-span-2 md:col-span-3 relative pb-3 overflow-hidden">
        <div class="flex flex-col h-full ">
          <app-breadcrumb [items]="[{label: 'bids'}]"/>
          <div class="flex flex-col mt-3">
            <app-auction-panel [sale]="sale"/>
            <app-bids-feed/>
          </div>
        </div>
        <app-notification-panel class="contents"/>
      </section>
    </div>
  </main>
  <app-accordion/>
  <app-footer/>
} @else {
  <app-not-found/>
}
